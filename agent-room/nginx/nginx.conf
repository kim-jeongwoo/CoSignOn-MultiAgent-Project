# agent-room 입구: 127.0.0.1:8082 → AutoGen Studio 127.0.0.1:8081. 사용자 권한 nginx (시스템 nginx와 별개)
# 로그인: 직접 만든 로그인 페이지(이름 아무거나 + 비밀번호는 ROOM_PASSWORD) — 확인은 room_gate(8095)가 한다(auth_request).
# /room = 카톡식 대화방(room_gate가 내줌), 그 밖 = Studio 원래 화면(접속자 위젯을 끼워 넣음, sub_filter).
worker_processes 1;
pid /home/dmlserver/agent-room/nginx/nginx.pid;
error_log /home/dmlserver/agent-room/nginx/logs/error.log warn;
events { worker_connections 256; }
http {
    access_log /home/dmlserver/agent-room/nginx/logs/access.log;
    client_body_temp_path /home/dmlserver/agent-room/nginx/tmp/body; proxy_temp_path /home/dmlserver/agent-room/nginx/tmp/proxy; fastcgi_temp_path /home/dmlserver/agent-room/nginx/tmp/fcgi;
    uwsgi_temp_path /home/dmlserver/agent-room/nginx/tmp/uwsgi; scgi_temp_path /home/dmlserver/agent-room/nginx/tmp/scgi;
    client_max_body_size 20m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:8082;
        absolute_redirect off;
        error_page 401 = @login;

        location = /__room_auth {
            internal;
            proxy_pass http://127.0.0.1:8095/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location @login {
            return 302 /__room/login?next=$request_uri;
        }
        location /__room/log {
            proxy_pass http://127.0.0.1:8095;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /__room/ {
            auth_request /__room_auth;
            proxy_pass http://127.0.0.1:8095;
        }
        location = /room {
            auth_request /__room_auth;
            proxy_pass http://127.0.0.1:8095;
        }
        location / {
            auth_request /__room_auth;
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            sub_filter_types text/html;
            sub_filter '</body>' '<script src="/__room/widget.js"></script></body>';
            sub_filter_once on;
        }
    }
}
