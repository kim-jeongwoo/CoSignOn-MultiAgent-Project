# agent-room 입구: 127.0.0.1:8082 → AutoGen Studio 127.0.0.1:8081. 사용자 권한 nginx (시스템 nginx와 별개)
# 로그인: 관리자 승인 방식. 승인 요청(/__room/*)·대화방(/room)·관리자(/admin)는 room_gate(8095)가 직접 처리하고,
# 그 밖(Studio 화면·API·웹소켓)은 room_gate의 /auth로 권한 확인(auth_request): 일반 사용자는 대화에 필요한 API만, 나머지는 관리자만.
worker_processes 1;
pid /home/dmlserver/agent-room/nginx/nginx.pid;
error_log /home/dmlserver/agent-room/nginx/logs/error.log warn;
events { worker_connections 256; }
http {
    access_log /home/dmlserver/agent-room/nginx/logs/access.log;
    client_body_temp_path /home/dmlserver/agent-room/nginx/tmp/body; proxy_temp_path /home/dmlserver/agent-room/nginx/tmp/proxy; fastcgi_temp_path /home/dmlserver/agent-room/nginx/tmp/fcgi;
    uwsgi_temp_path /home/dmlserver/agent-room/nginx/tmp/uwsgi; scgi_temp_path /home/dmlserver/agent-room/nginx/tmp/scgi;
    client_max_body_size 20m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:8082;
        absolute_redirect off;
        error_page 401 = @request;
        error_page 403 = @forbidden;

        location = /__room_auth {
            internal;
            proxy_pass http://127.0.0.1:8095/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
        }
        location @request {
            return 302 /__room/request?next=$request_uri;
        }
        location @forbidden {
            return 302 /room;
        }
        location /__room/ {
            proxy_pass http://127.0.0.1:8095;
        }
        location = /room {
            proxy_pass http://127.0.0.1:8095;
        }
        location /admin {
            proxy_pass http://127.0.0.1:8095;
        }
        location / {
            auth_request /__room_auth;
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            sub_filter_types text/html;
            sub_filter '</body>' '<script src="/__room/widget.js"></script></body>';
            sub_filter_once on;
        }
    }
}
